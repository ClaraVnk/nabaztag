name: Security

# Weekly, and on demand. A vulnerability published about something already in
# the images is found here even when nobody pushes.
on:
  schedule:
    - cron: "41 5 * * 1"  # Mondays 05:41 UTC
  workflow_dispatch:
  # A change to an image (Dependabot's included) is built and scanned before
  # it merges, not discovered on Monday.
  pull_request:
    paths:
      - "nabaztag-violet/**"
      - "firmware-arm/**"
      - ".github/**"

permissions:
  contents: read

env:
  OSV_SCANNER: ghcr.io/google/osv-scanner:v2.6.0

jobs:
  secrets:
    name: Secret scan (gitleaks, whole history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action's own default, written down so a bump of the action
          # cannot change the scanner with it. It never fetches "latest" unless
          # told to.
          GITLEAKS_VERSION: "8.24.3"

  image:
    name: Image scan (nabaztag-violet, report only)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the add-on image
        run: podman build -t nabaztag-violet:scan nabaztag-violet
      - name: Scan its packages (osv-scanner)
        # Report only: Alpine images routinely carry advisories with no fix yet,
        # and a job that fails every Monday on those teaches everyone to ignore
        # it. The findings are in the job summary and the uploaded report.
        continue-on-error: true
        run: |
          podman save -o image.tar nabaztag-violet:scan
          set -o pipefail
          podman run --rm -v "$PWD/image.tar:/image.tar:ro" "$OSV_SCANNER" \
            scan image --archive /image.tar | tee osv-report.txt
      - name: Summary
        if: always()
        run: |
          {
            echo "## osv-scanner — nabaztag-violet"
            echo '```'
            tail -n 60 osv-report.txt 2>/dev/null || echo "no report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: osv-report
          path: osv-report.txt
          if-no-files-found: ignore

  upstream:
    name: Pinned upstreams not covered by Dependabot (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare the pinned whisper.cpp release with the latest one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned=$(sed -n 's/^ARG WHISPER_VERSION=//p' nabaztag-violet/Dockerfile)
          latest=$(gh api repos/ggml-org/whisper.cpp/releases/latest --jq .tag_name)
          {
            echo "## Pinned upstreams"
            if [ "$pinned" = "$latest" ]; then
              echo "whisper.cpp: $pinned is the latest release."
            else
              echo "whisper.cpp: pinned $pinned, latest is **$latest** — update WHISPER_VERSION and WHISPER_COMMIT in nabaztag-violet/Dockerfile."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
