name: Add-on

# The add-on's adoption key and TLS (nabaztag-violet/adoption.py and the
# listeners in server.py): the firmware's own vectors for the exchange and
# the PSK, and a real TLS 1.3 PSK client against the add-on's listeners. A
# mistake here locks a confirmed rabbit out or lets someone else in.
on:
  push:
    branches: [main]
    paths: ["nabaztag-violet/**", ".github/workflows/addon.yml"]
  pull_request:
    paths: ["nabaztag-violet/**", ".github/workflows/addon.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Adoption key and TLS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # The add-on's base image; TLS with a pre-shared key needs 3.13.
          python-version: "3.15"
      - name: Unit and end-to-end tests
        run: |
          cd nabaztag-violet
          python -m unittest discover -s tests -v
