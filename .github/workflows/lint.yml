name: Lint

# Python (ruff: bugs, not style), shell (shellcheck: errors), the workflows
# themselves (actionlint) and the add-on's YAML. A translation file with an
# unquoted ": " once made the Supervisor drop the whole file in silence; a
# parse here catches that before a user sees raw keys.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (ruff, shellcheck, actionlint, YAML)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: ruff
        run: |
          python -m pip install --quiet ruff==0.14.14 pyyaml==6.0.3
          ruff check --output-format github .
      - name: shellcheck
        run: |
          shellcheck --version | head -2
          find . -name '*.sh' -not -path './legacy/*' -not -path './firmware-arm/vendor/*' -print0 \
            | xargs -0 shellcheck --severity=error
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo docker.io/rhysd/actionlint:1.7.8 -color
      - name: The add-on's YAML parses
        run: |
          python - <<'PY'
          import pathlib, sys, yaml
          bad = 0
          for p in sorted(pathlib.Path("nabaztag-violet").rglob("*.yaml")):
              try:
                  yaml.safe_load(p.read_text())
              except yaml.YAMLError as e:
                  bad += 1
                  print(f"::error file={p}::{e}")
          sys.exit(1 if bad else 0)
          PY
