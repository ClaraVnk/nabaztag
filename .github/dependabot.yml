# Dependency updates, opened as pull requests. This repository has no Python
# dependency manifest (the add-ons use the standard library only), so what moves
# under it are the base images and the actions of its own workflows.
version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /nabaztag-violet
      - /nabaztag-server
      - /firmware-arm
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
