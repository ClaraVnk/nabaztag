name: "Nabaztag Violet Server"
version: "0.12.2"
slug: "nabaztag_violet"
description: "Our own clean server for the original Nabaztag/tag (Violet protocol): serves the bytecode, accepts the rabbit's XMPP, drives ears/LEDs/sound/TTS, and (Phase 2) does button push-to-talk → bundled STT → conversation agent → speech. For Home Assistant."
url: "https://github.com/ClaraVnk/nabaztag/tree/main/nabaztag-violet"
arch:
  - amd64
init: false
startup: services
boot: auto
host_network: false
# Lets the add-on call Home Assistant services (e.g. the conversation agent) via
# the Supervisor proxy, for the voice pipeline.
homeassistant_api: true
# Keep host ports == container ports: the rabbit reaches the server on the
# standard ports advertised by /vl/locate.jsp. Set server_address to the HAOS
# host IP. (Stop the OpenJabNab add-on first — it also uses :80/:5222.)
ports:
  "80/tcp": 80
  "5222/tcp": 5222
  "8080/tcp": 8099
  "4000/udp": 4000
ports_description:
  "80/tcp": "Boot: /vl/bc.jsp serves the bytecode, /vl/locate.jsp points the rabbit at us."
  "5222/tcp": "XMPP: the rabbit connects here; the server pushes violet:packet commands."
  "8080/tcp": "Control API for Home Assistant — reached on host port 8099 (8080 is taken by signal-cli)."
  "4000/udp": "Microphone stream from the rabbit (hybrid bytecode only) — Phase-2/3 voice."
options:
  server_address: "192.0.2.10"
  log_level: "Info"
  api_token: ""
  bootcode: "ojn"
  voice_pipeline: false
  conversation_agent: ""
  stt_language: "fr"
  tts_engine: "espeak"
  tts_entity: "tts.piper"
  voice_pitch: 0
  wake_word: "nabi"
  auto_listen: false
  connect_jingle: ""
  wake_chime: "start_record"
  personality: "off"
  voice_prompt: "Tu es Nabi, un lapin Nabaztag (le lapin culte de Violet) : tu t'appelles Nabi et tu parles à la première personne. Théâtral, espiègle, ULTRA bref. Réponds en français en UNE phrase courte (jamais de monologue). Soigne la mise en scène : ménage des pauses dramatiques avec « … » (ex. la météo se dit « Aujourd'hui… pluie ! »). Pas de markdown ni d'emoji. Tu peux AGIR en insérant des balises (exécutées puis retirées de la parole) : [ears G D] (oreilles 0 à 16), [led ZONE R V B] (ZONE = bottom|left|middle|right|top, couleurs 0 à 255), [nose N] (nez 0,1,2). Voici ce qu'on te dit : "
schema:
  server_address: "str"
  log_level: "list(Debug|Info|Warning|Error)"
  api_token: "str?"
  bootcode: "list(violet|ojn|hybrid)"
  voice_pipeline: "bool"
  conversation_agent: "str?"
  stt_language: "str"
  tts_engine: "list(espeak|piper)"
  tts_entity: "str?"
  voice_pitch: "int?"
  wake_word: "str?"
  auto_listen: "bool"
  connect_jingle: "str?"
  wake_chime: "str?"
  personality: "list(off|subtle|auto|lively)"
  voice_prompt: "str?"
