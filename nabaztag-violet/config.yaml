name: "Nabaztag Violet Server"
version: "0.15.3"
slug: "nabaztag_violet"
description: "Our own clean server for the original Nabaztag/tag (Violet protocol): serves the bytecode, accepts the rabbit's XMPP, drives ears/LEDs/sound/TTS, and (Phase 2) does button push-to-talk → bundled STT → conversation agent → speech. For Home Assistant."
url: "https://github.com/ClaraVnk/nabaztag/tree/main/nabaztag-violet"
arch:
  - amd64
init: false
startup: services
boot: auto
host_network: false
# Lets the add-on call Home Assistant services (e.g. the conversation agent) via
# the Supervisor proxy, for the voice pipeline.
homeassistant_api: true
# Keep host ports == container ports: the rabbit reaches the server on the
# standard ports advertised by /vl/locate.jsp. Set server_address to the HAOS
# host IP. (Stop the OpenJabNab add-on first — it also uses :80/:5222.)
ports:
  "80/tcp": 80
  "5222/tcp": 5222
  "8080/tcp": 8099
  "4000/udp": 4000
ports_description:
  "80/tcp": "Boot: /vl/bc.jsp serves the bytecode, /vl/locate.jsp points the rabbit at us."
  "5222/tcp": "XMPP: the rabbit connects here; the server pushes violet:packet commands."
  "8080/tcp": "Control API for Home Assistant — reached on host port 8099 (8080 is taken by signal-cli)."
  "4000/udp": "Microphone stream from the rabbit (hybrid bytecode only) — Phase-2/3 voice."
options:
  server_address: "192.0.2.10"
  log_level: "Info"
  api_token: ""
  voice_pipeline: false
  conversation_agent: "none"
  stt_language: "fr"
  stt_model: "small"
  tts_engine: "piper"
  voice_pitch: 0
  auto_listen: false
  connect_jingle: "none"
  wake_chime: "start_record"
  personality: "off"
schema:
  server_address: "str"
  log_level: "list(Debug|Info|Warning|Error)"
  api_token: "str?"
  voice_pipeline: "bool"
  conversation_agent: "list(none|conversation.home_assistant|conversation.claude_conversation)"
  stt_language: "str"
  stt_model: "list(tiny|base|small)?"
  tts_engine: "list(espeak|piper)"
  voice_pitch: "int?"
  auto_listen: "bool"
  connect_jingle: "list(none|acquired|ack|abort|ministop|ears|rfid_ok|start_record|end_record|start_interactive|end_interactive|previous|next)"
  wake_chime: "list(none|acquired|ack|abort|ministop|ears|rfid_ok|start_record|end_record|start_interactive|end_interactive|previous|next)"
  personality: "list(off|discret|normal|vif)"
