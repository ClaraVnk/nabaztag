name: "Nabaztag Violet Server"
version: "0.3.4"
slug: "nabaztag_violet"
description: "Our own clean server for the original Nabaztag/tag (Violet protocol): serves the bytecode, accepts the rabbit's XMPP, drives ears/LEDs/sound/TTS, and (Phase 2) does button push-to-talk → bundled STT → conversation agent → speech. For Home Assistant."
url: "https://github.com/ClaraVnk/nabaztag/tree/main/nabaztag-violet"
arch:
  - amd64
init: false
startup: services
boot: auto
host_network: false
# Lets the add-on call Home Assistant services (e.g. the conversation agent) via
# the Supervisor proxy, for the voice pipeline.
homeassistant_api: true
# Keep host ports == container ports: the rabbit reaches the server on the
# standard ports advertised by /vl/locate.jsp. Set server_address to the HAOS
# host IP. (Stop the OpenJabNab add-on first — it also uses :80/:5222.)
ports:
  "80/tcp": 80
  "5222/tcp": 5222
  "8080/tcp": 8099
ports_description:
  "80/tcp": "Boot: /vl/bc.jsp serves the bytecode, /vl/locate.jsp points the rabbit at us."
  "5222/tcp": "XMPP: the rabbit connects here; the server pushes violet:packet commands."
  "8080/tcp": "Control API for Home Assistant — reached on host port 8099 (8080 is taken by signal-cli)."
options:
  server_address: "192.0.2.10"
  log_level: "Info"
  bootcode: "ojn"
  voice_pipeline: false
  conversation_agent: ""
  stt_language: "fr"
  tts_engine: "espeak"
  tts_entity: "tts.piper"
  voice_prompt: "Tu es la voix d'un lapin Nabaztag espiègle. Réponds en français, en une ou deux phrases courtes. Tu peux AGIR en insérant des balises dans ta réponse : [ears G D] (oreilles, positions 0 à 16), [led ZONE R V B] (ZONE = bottom|left|middle|right|top, couleurs 0 à 255), [nose N] (nez, N = 0,1,2). Les balises sont exécutées puis retirées de ce qui est dit à voix haute. Voici ce qu'on te dit : "
schema:
  server_address: "str"
  log_level: "list(Debug|Info|Warning|Error)"
  bootcode: "list(violet|ojn)"
  voice_pipeline: "bool"
  conversation_agent: "str?"
  stt_language: "str"
  tts_engine: "list(espeak|piper)"
  tts_entity: "str?"
  voice_prompt: "str?"
