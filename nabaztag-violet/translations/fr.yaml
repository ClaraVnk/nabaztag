configuration:
  server_address:
    name: "Adresse du serveur (nom d'hôte)"
    description: "Le nom d'hôte que le lapin résout pour joindre ce serveur (ex. nabaztag.lan). Doit être un nom DNS, pas une IP — le bytecode résout le serveur XMPP par DNS."
  log_level:
    name: "Niveau de log (avancé)"
    description: "Niveau de détail écrit dans le journal de l'add-on. Passe à Debug pour investiguer un souci."
  api_token:
    name: "Jeton d'API (avancé)"
    description: "Si renseigné, l'API de contrôle exige ce jeton (en-tête X-API-Token ou paramètre token). À laisser vide sur un LAN de confiance derrière Home Assistant."
  voice_pipeline:
    name: "Pipeline vocal"
    description: "Maintiens la tête et parle, puis transcription (whisper.cpp), agent conversationnel, puis réponse parlée."
  conversation_agent:
    name: "Agent conversationnel"
    description: "Quelle entité conversation de Home Assistant répond — l'Assist local ou Claude. « none » répète juste la transcription."
  stt_language:
    name: "Langue de reconnaissance vocale"
    description: "Code langue pour la transcription (ex. fr, en)."
  stt_model:
    name: "Modèle de reconnaissance vocale"
    description: "Taille du modèle Whisper. small est le plus précis (embarqué) ; base et tiny sont bien plus rapides sur CPU (réponse moins longue) au prix d'un peu de précision. base/tiny sont téléchargés une fois à la première utilisation."
  tts_engine:
    name: "Moteur de synthèse vocale"
    description: "espeak (embarqué, robotique, 100% local) ou piper/ha (parle via le moteur TTS de Home Assistant choisi ci-dessous — voix neuronale). Mets piper/ha pour une voix naturelle."
  tts_entity:
    name: "Voix Home Assistant (entité TTS)"
    description: "Quand le moteur est piper/ha, l'entité TTS de HA utilisée pour parler. Pour une voix plus naturelle (style Siri/Alexa), pointe vers une voix neuronale : tts.piper (local), tts.home_assistant_cloud (Nabu Casa), tts.elevenlabs, tts.google_cloud, tts.azure, tts.openai… N'importe quelle entité tts.* de ton HA marche."
  voice_pitch:
    name: "Aigu de la voix (pourcentage)"
    description: "Monte la voix pour un timbre plus mignon, jeune et espiègle. 0 = off (le plus naturel) ; environ 12 à 18 donne un joli côté « mignonne » ; au-delà de 30 ça fait chipmunk."
  auto_listen:
    name: "Écoute passive (vie privée)"
    description: "DÉSACTIVÉE par défaut. Activée, Nabi écoute en continu le mot d'éveil et son micro diffuse. Désactivée, le micro ne diffuse jamais — le push-to-talk (bouton) fonctionne quand même."
  connect_jingle:
    name: "Jingle de connexion"
    description: "Joue ce jingle quand Nabi se connecte. « none » = aucun jingle."
  wake_chime:
    name: "Bip d'éveil"
    description: "Un court bip joué juste après le mot d'éveil, pendant que l'agent prépare sa réponse. « none » = aucun bip."
  personality:
    name: "Personnalité"
    description: "Laisse Nabi vivre seul — petits gestes aléatoires (oreilles/LED/nez), en journée. off = aucun (tu le pilotes depuis Home Assistant) ; discret / normal / vif = la fréquence."
