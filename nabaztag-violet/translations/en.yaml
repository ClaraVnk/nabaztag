configuration:
  server_address:
    name: "Server address (hostname)"
    description: "The hostname the rabbit resolves to reach this server (e.g. nabaztag.lan). Must be a DNS name, not an IP — the bytecode resolves the XMPP server by DNS."
  log_level:
    name: "Log level (advanced)"
    description: "How much detail to write to the add-on log. Increase to Debug to investigate issues."
  api_token:
    name: "API token (advanced)"
    description: "If set, the control API requires this token (X-API-Token header or token query param). Leave empty on a trusted LAN behind Home Assistant."
  voice_pipeline:
    name: "Voice pipeline"
    description: "Hold the head button and speak, then transcribe (whisper.cpp), ask the conversation agent, and speak the reply."
  conversation_agent:
    name: "Conversation agent"
    description: "Which Home Assistant conversation entity answers — local Assist or Claude. 'none' just echoes the transcription."
  stt_language:
    name: "Speech-to-text language"
    description: "Language code used for transcription (e.g. fr, en)."
  stt_model:
    name: "Speech-to-text model"
    description: "Whisper model size. small is the most accurate (bundled); base and tiny are much faster on CPU (lower reply latency) at some accuracy cost. base/tiny are downloaded once on first use."
  tts_engine:
    name: "Text-to-speech engine"
    description: "espeak (bundled, robotic, fully local) or piper/ha (speak through the Home Assistant TTS entity chosen below — a neural voice). Use piper/ha for a natural voice."
  tts_entity:
    name: "Home Assistant voice (TTS entity)"
    description: "When the engine is piper/ha, the HA TTS entity to speak through. For a more natural (Siri/Alexa-like) voice, point it at a neural one: tts.piper (local), tts.home_assistant_cloud (Nabu Casa), tts.elevenlabs, tts.google_cloud, tts.azure, tts.openai… any tts.* entity in your HA works."
  voice_pitch:
    name: "Voice pitch-up (percent)"
    description: "Shift the voice up for a cuter, younger, more playful timbre. 0 = off (most natural); around 12 to 18 is a nice 'mignonne' range; above 30 sounds chipmunk-y."
  auto_listen:
    name: "Passive listening (privacy)"
    description: "OFF by default. When on, Nabi listens continuously for the wake word and its microphone streams. When off the mic never streams — push-to-talk still works. (Runtime toggling via the dashboard now also survives add-on restarts.)"
  connect_jingle:
    name: "Connect jingle"
    description: "Play this jingle once Nabi comes online. 'none' = no jingle."
  wake_chime:
    name: "Wake chime"
    description: "A short chime played right after the wake word, while the agent composes its reply. 'none' = no chime."
  personality:
    name: "Personality"
    description: "Let Nabi act on its own — random gentle ear/LED/nose moves, daytime only. off = none (drive it yourself from Home Assistant); discret / normal / vif = how often."
