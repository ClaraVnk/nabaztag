# A Raspberry Pi as the JTAG probe for a Nabaztag/tag v2 (OKI ML67Q4051,
# ARM7TDMI). Five female-to-female jumpers, no J-Link, no level shifter.
#
#   openocd -f nabaztag-pi.cfg                        # scan, halt
#   openocd -f nabaztag-pi.cfg -f oki.tcl -c "..."    # erase / program
#
# Wiring, rabbit 8-pin header (top-left of the board, rabbit seen from the
# front, under the base) to the Pi 40-pin header:
#
#   rabbit 2 GND  -> Pi 20
#   rabbit 4 TDI  -> Pi 19   GPIO10
#   rabbit 5 TMS  -> Pi 24   GPIO8
#   rabbit 6 TCK  -> Pi 23   GPIO11
#   rabbit 7 TDO  -> Pi 21   GPIO9
#
# Pin 1 (3V3 Vref), pin 3 (nTRST) and pin 8 (RESETN) stay unconnected. The
# rabbit runs on its own mains adapter: the Pi only talks on these lines, it
# does not power the SoC, and JTAG does not answer an unpowered board.
#
# RESETN deliberately stays out. Wiring it and declaring SRST here is what
# produced "DBGACK timeout" on this chip in June 2026; and `reset halt` does
# not work on this ARM7TDMI whatever you declare. To reset the rabbit, pull
# the plug. The first `halt` on a rabbit that is *running* often times out
# too -- run the command again, it catches on the second attempt.

adapter driver linuxgpiod
adapter gpio tck -chip 0 11
adapter gpio tms -chip 0 8
adapter gpio tdi -chip 0 10
adapter gpio tdo -chip 0 9

# OpenOCD 0.11 and older want this instead of the four lines above:
#   linuxgpiod_gpiochip 0
#   linuxgpiod_jtag_nums 11 8 10 9

# Bit-banged from userspace, so this is a ceiling, not a speed. The limit is
# the kernel round-trip per edge; raising it does not make the flash faster
# (one programmed word costs ~19 ms whatever happens) and does make the scan
# chain flaky on long jumpers.
adapter speed 100

transport select jtag
reset_config none

set CHIP ml67q4051
jtag newtap $CHIP cpu -irlen 4 -expected-id 0x3f0f0f0f
target create $CHIP.cpu arm7tdmi -endian little -chain-position $CHIP.cpu

# Internal SRAM, 16 KB at 0x10000000. The low 4 KB is .data and the startup
# stack of a running rabbit, so a work area there is only safe once the core
# is halted and we are not going to resume it.
$CHIP.cpu configure -work-area-phys 0x10000000 -work-area-size 0x1000 \
    -work-area-backup 1

init
scan_chain
halt
