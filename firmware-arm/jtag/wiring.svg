<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 760" width="1040" height="760" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">
<rect width="1040" height="760" fill="#fdfdfb"/>
<text x="520" y="34" text-anchor="middle" fill="#161616" font-size="17" font-weight="600">Nabaztag/tag v2 JTAG → Raspberry Pi</text>
<text x="520" y="54" text-anchor="middle" fill="#6b6b6b">five jumpers, no probe — the rabbit stays on its own mains adapter</text>
<text x="40" y="122" fill="#161616" font-weight="600">rabbit, 8-pin header</text>
<text x="40" y="138" fill="#6b6b6b" font-size="11">top-left of the board, front view, under the base</text>
<rect x="150" y="150" width="16" height="16" rx="3" fill="#fdfdfb" stroke="#bbbbbb"/>
<text x="74" y="162" text-anchor="end" fill="#6b6b6b">1</text>
<text x="140" y="162" text-anchor="end" fill="#6b6b6b" >3V3</text>
<rect x="150" y="176" width="16" height="16" rx="3" fill="#444444" stroke="#444444"/>
<text x="74" y="188" text-anchor="end" fill="#6b6b6b">2</text>
<text x="140" y="188" text-anchor="end" fill="#161616" font-weight="600">GND</text>
<rect x="150" y="202" width="16" height="16" rx="3" fill="#fdfdfb" stroke="#bbbbbb"/>
<text x="74" y="214" text-anchor="end" fill="#6b6b6b">3</text>
<text x="140" y="214" text-anchor="end" fill="#6b6b6b" >nTRST</text>
<rect x="150" y="228" width="16" height="16" rx="3" fill="#c2410c" stroke="#c2410c"/>
<text x="74" y="240" text-anchor="end" fill="#6b6b6b">4</text>
<text x="140" y="240" text-anchor="end" fill="#161616" font-weight="600">TDI</text>
<rect x="150" y="254" width="16" height="16" rx="3" fill="#047857" stroke="#047857"/>
<text x="74" y="266" text-anchor="end" fill="#6b6b6b">5</text>
<text x="140" y="266" text-anchor="end" fill="#161616" font-weight="600">TMS</text>
<rect x="150" y="280" width="16" height="16" rx="3" fill="#1d4ed8" stroke="#1d4ed8"/>
<text x="74" y="292" text-anchor="end" fill="#6b6b6b">6</text>
<text x="140" y="292" text-anchor="end" fill="#161616" font-weight="600">TCK</text>
<rect x="150" y="306" width="16" height="16" rx="3" fill="#a21caf" stroke="#a21caf"/>
<text x="74" y="318" text-anchor="end" fill="#6b6b6b">7</text>
<text x="140" y="318" text-anchor="end" fill="#161616" font-weight="600">TDO</text>
<rect x="150" y="332" width="16" height="16" rx="3" fill="#fdfdfb" stroke="#bbbbbb"/>
<text x="74" y="344" text-anchor="end" fill="#6b6b6b">8</text>
<text x="140" y="344" text-anchor="end" fill="#6b6b6b" >RESETN</text>
<text x="620" y="88" fill="#161616" font-weight="600">Raspberry Pi, 40-pin header</text>
<text x="620" y="104" fill="#6b6b6b" font-size="11">physical pins — same on a 2, 3, 4 or Zero 2 W</text>
<text x="616" y="116" fill="#6b6b6b" font-size="10">pin 1</text>
<rect x="620" y="118" width="15" height="15" rx="3" fill="#fdfdfb" stroke="#cfcfcf"/>
<rect x="648" y="118" width="15" height="15" rx="3" fill="#fdfdfb" stroke="#cfcfcf"/>
<rect x="620" y="142" width="15" height="15" rx="3" fill="#fdfdfb" stroke="#cfcfcf"/>
<rect x="648" y="142" width="15" height="15" rx="3" fill="#fdfdfb" stroke="#cfcfcf"/>
<rect x="620" y="166" width="15" height="15" rx="3" fill="#fdfdfb" stroke="#cfcfcf"/>
<rect x="648" y="166" width="15" height="15" rx="3" fill="#fdfdfb" stroke="#cfcfcf"/>
<rect x="620" y="190" width="15" height="15" rx="3" fill="#fdfdfb" stroke="#cfcfcf"/>
<rect x="648" y="190" width="15" height="15" rx="3" fill="#fdfdfb" stroke="#cfcfcf"/>
<rect x="620" y="214" width="15" height="15" rx="3" fill="#fdfdfb" stroke="#cfcfcf"/>
<rect x="648" y="214" width="15" height="15" rx="3" fill="#fdfdfb" stroke="#cfcfcf"/>
<rect x="620" y="238" width="15" height="15" rx="3" fill="#fdfdfb" stroke="#cfcfcf"/>
<rect x="648" y="238" width="15" height="15" rx="3" fill="#fdfdfb" stroke="#cfcfcf"/>
<rect x="620" y="262" width="15" height="15" rx="3" fill="#fdfdfb" stroke="#cfcfcf"/>
<rect x="648" y="262" width="15" height="15" rx="3" fill="#fdfdfb" stroke="#cfcfcf"/>
<rect x="620" y="286" width="15" height="15" rx="3" fill="#fdfdfb" stroke="#cfcfcf"/>
<rect x="648" y="286" width="15" height="15" rx="3" fill="#fdfdfb" stroke="#cfcfcf"/>
<rect x="620" y="310" width="15" height="15" rx="3" fill="#fdfdfb" stroke="#cfcfcf"/>
<rect x="648" y="310" width="15" height="15" rx="3" fill="#fdfdfb" stroke="#cfcfcf"/>
<rect x="620" y="334" width="15" height="15" rx="3" fill="#c2410c" stroke="#c2410c"/>
<text x="686" y="335" fill="#c2410c" font-size="11.5" font-weight="600">pin 19<tspan fill="#6b6b6b" font-weight="400"> · GPIO10</tspan></text>
<rect x="648" y="334" width="15" height="15" rx="3" fill="#444444" stroke="#444444"/>
<text x="686" y="349" fill="#444444" font-size="11.5" font-weight="600">pin 20<tspan fill="#6b6b6b" font-weight="400"> · GND</tspan></text>
<rect x="620" y="358" width="15" height="15" rx="3" fill="#a21caf" stroke="#a21caf"/>
<text x="686" y="359" fill="#a21caf" font-size="11.5" font-weight="600">pin 21<tspan fill="#6b6b6b" font-weight="400"> · GPIO9</tspan></text>
<rect x="648" y="358" width="15" height="15" rx="3" fill="#fdfdfb" stroke="#cfcfcf"/>
<rect x="620" y="382" width="15" height="15" rx="3" fill="#1d4ed8" stroke="#1d4ed8"/>
<text x="686" y="383" fill="#1d4ed8" font-size="11.5" font-weight="600">pin 23<tspan fill="#6b6b6b" font-weight="400"> · GPIO11</tspan></text>
<rect x="648" y="382" width="15" height="15" rx="3" fill="#047857" stroke="#047857"/>
<text x="686" y="397" fill="#047857" font-size="11.5" font-weight="600">pin 24<tspan fill="#6b6b6b" font-weight="400"> · GPIO8</tspan></text>
<rect x="620" y="406" width="15" height="15" rx="3" fill="#fdfdfb" stroke="#cfcfcf"/>
<rect x="648" y="406" width="15" height="15" rx="3" fill="#fdfdfb" stroke="#cfcfcf"/>
<rect x="620" y="430" width="15" height="15" rx="3" fill="#fdfdfb" stroke="#cfcfcf"/>
<rect x="648" y="430" width="15" height="15" rx="3" fill="#fdfdfb" stroke="#cfcfcf"/>
<rect x="620" y="454" width="15" height="15" rx="3" fill="#fdfdfb" stroke="#cfcfcf"/>
<rect x="648" y="454" width="15" height="15" rx="3" fill="#fdfdfb" stroke="#cfcfcf"/>
<rect x="620" y="478" width="15" height="15" rx="3" fill="#fdfdfb" stroke="#cfcfcf"/>
<rect x="648" y="478" width="15" height="15" rx="3" fill="#fdfdfb" stroke="#cfcfcf"/>
<rect x="620" y="502" width="15" height="15" rx="3" fill="#fdfdfb" stroke="#cfcfcf"/>
<rect x="648" y="502" width="15" height="15" rx="3" fill="#fdfdfb" stroke="#cfcfcf"/>
<rect x="620" y="526" width="15" height="15" rx="3" fill="#fdfdfb" stroke="#cfcfcf"/>
<rect x="648" y="526" width="15" height="15" rx="3" fill="#fdfdfb" stroke="#cfcfcf"/>
<rect x="620" y="550" width="15" height="15" rx="3" fill="#fdfdfb" stroke="#cfcfcf"/>
<rect x="648" y="550" width="15" height="15" rx="3" fill="#fdfdfb" stroke="#cfcfcf"/>
<rect x="620" y="574" width="15" height="15" rx="3" fill="#fdfdfb" stroke="#cfcfcf"/>
<rect x="648" y="574" width="15" height="15" rx="3" fill="#fdfdfb" stroke="#cfcfcf"/>
<path d="M 168 184 C 407.0 184, 407.0 341, 646 341" fill="none" stroke="#444444" stroke-width="2.2" stroke-linecap="round"/>
<path d="M 168 236 C 393.0 236, 393.0 341, 618 341" fill="none" stroke="#c2410c" stroke-width="2.2" stroke-linecap="round"/>
<path d="M 168 262 C 407.0 262, 407.0 389, 646 389" fill="none" stroke="#047857" stroke-width="2.2" stroke-linecap="round"/>
<path d="M 168 288 C 393.0 288, 393.0 389, 618 389" fill="none" stroke="#1d4ed8" stroke-width="2.2" stroke-linecap="round"/>
<path d="M 168 314 C 393.0 314, 393.0 365, 618 365" fill="none" stroke="#a21caf" stroke-width="2.2" stroke-linecap="round"/>
<text x="40" y="394" fill="#6b6b6b" font-size="11">pins 1, 3 and 8 stay unconnected — 3V3 is only a Vref, and RESETN is a trap</text>
<text x="40" y="414" fill="#161616" font-weight="600">the five jumpers</text>
<rect x="40" y="427" width="11" height="11" rx="2" fill="#444444"/>
<text x="58" y="436" fill="#161616" font-size="12">rabbit 2 GND<tspan fill="#6b6b6b">  →  </tspan>Pi 20 <tspan fill="#6b6b6b">GND</tspan></text>
<rect x="40" y="446" width="11" height="11" rx="2" fill="#c2410c"/>
<text x="58" y="455" fill="#161616" font-size="12">rabbit 4 TDI<tspan fill="#6b6b6b">  →  </tspan>Pi 19 <tspan fill="#6b6b6b">GPIO10</tspan></text>
<rect x="40" y="465" width="11" height="11" rx="2" fill="#047857"/>
<text x="58" y="474" fill="#161616" font-size="12">rabbit 5 TMS<tspan fill="#6b6b6b">  →  </tspan>Pi 24 <tspan fill="#6b6b6b">GPIO8</tspan></text>
<rect x="40" y="484" width="11" height="11" rx="2" fill="#1d4ed8"/>
<text x="58" y="493" fill="#161616" font-size="12">rabbit 6 TCK<tspan fill="#6b6b6b">  →  </tspan>Pi 23 <tspan fill="#6b6b6b">GPIO11</tspan></text>
<rect x="40" y="503" width="11" height="11" rx="2" fill="#a21caf"/>
<text x="58" y="512" fill="#161616" font-size="12">rabbit 7 TDO<tspan fill="#6b6b6b">  →  </tspan>Pi 21 <tspan fill="#6b6b6b">GPIO9</tspan></text>
<text x="40" y="664" fill="#161616" font-weight="600">and three things that bite</text>
<text x="40" y="684" fill="#6b6b6b" font-size="11">• RESETN stays unconnected. Wired, this chip answers DBGACK timeout,</text>
<text x="40" y="701" fill="#6b6b6b" font-size="11">• and reset halt does not work on it however you configure it.</text>
<text x="40" y="718" fill="#6b6b6b" font-size="11">• The Pi does not power the rabbit: an unpowered board never answers.</text>
<text x="40" y="735" fill="#6b6b6b" font-size="11">• The first halt on a running rabbit often times out — run it again.</text>
</svg>
