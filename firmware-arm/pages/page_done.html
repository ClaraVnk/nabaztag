<!doctype html><html lang=en><head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Nabaztag connecting</title>
<style>
:root{color-scheme:dark;--bg:#0e0e12;--fg:#eaeaef;--mut:#85858f;--acc:#b86bff;--card:#181820;--brd:#2a2a35}
*{box-sizing:border-box}
body{margin:0;padding:48px 16px;background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,system-ui,sans-serif;max-width:520px;margin-inline:auto;text-align:center}
h1{font-size:22px;margin:0 0 16px;font-weight:600}
.card{background:var(--card);border:1px solid var(--brd);border-radius:8px;padding:24px;text-align:left}
.card p{margin:0 0 12px;color:var(--fg)}
.card p:last-child{margin:0;color:var(--mut);font-size:13px}
.tag{display:inline-block;background:var(--acc);color:#fff;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;margin-bottom:14px}
</style></head><body>
<h1>Settings saved</h1>
<div class=card>
<span class=tag>connecting</span>
<p>Your rabbit is bringing itself online. The four belly lights will turn from <strong>orange</strong> to <strong>green</strong> when it's ready.</p>
<p>You can close this tab and reconnect your laptop / phone to your usual Wi-Fi.</p>
</div>
<footer style="margin-top:20px;color:var(--mut);font-size:12px">by <a href="https://cyberloutre.fr" style="color:var(--mut)">Loutre</a></footer>
</body></html>
