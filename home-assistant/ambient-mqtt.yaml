# Nabaztag (Nabi) — ambient automations via the native MQTT entities
# ---------------------------------------------------------------------------
# Requires the add-on v0.5.1+ (MQTT discovery). Once the broker is configured,
# the add-on publishes a "Nabaztag (Nabi)" device with these entities:
#   light.nabaztag_nabi_belly        (RGB)
#   number.nabaztag_nabi_ear_left    (0..16)
#   number.nabaztag_nabi_ear_right   (0..16)
#   select.nabaztag_nabi_nose        (off | blink | double)
#   switch.nabaztag_nabi_sleep
#   text.nabaztag_nabi_say
# The "nabi" segment is your device name — adjust the entity_ids to match yours.
#
# Install: drop this file in /config/packages/ and enable packages once in
# configuration.yaml:
#     homeassistant:
#       packages: !include_dir_named packages
# then Developer Tools → YAML → "Reload all YAML".
#
# Unlike home-assistant/nabaztag.yaml (HTTP /api rest_commands), this version
# drives the rabbit purely through the discovered MQTT entities — no MAC, no
# secrets. The HOME-STATE entities below (colour-of-the-day, persons,
# appliances, intercom) are examples from a real install: replace them with
# your own (look for the  # <-- your ...  markers).
# ---------------------------------------------------------------------------

script:
  # Belly = colour of the day. Example: France RTE Tempo (blue / white / red
  # day). Swap the sensor + mapping for any state you want to glance at.
  nabaztag_belly_tempo:
    alias: "Nabaztag - belly = colour of the day"
    sequence:
      - service: light.turn_on
        target:
          entity_id: light.nabaztag_nabi_belly
        data:
          rgb_color: >-
            {{ {'Bleu': [0, 90, 255], 'Blanc': [255, 255, 255], 'Rouge': [255, 0, 0]}.get(states('sensor.rte_tempo_couleur_actuelle'), [60, 60, 60]) }}

  # Quick two-step ear wiggle, returns to a neutral resting position (8).
  nabaztag_ears_wiggle:
    alias: "Nabaztag - ear wiggle"
    sequence:
      - service: number.set_value
        target: {entity_id: number.nabaztag_nabi_ear_left}
        data: {value: 2}
      - service: number.set_value
        target: {entity_id: number.nabaztag_nabi_ear_right}
        data: {value: 13}
      - delay: {milliseconds: 600}
      - service: number.set_value
        target: {entity_id: number.nabaztag_nabi_ear_left}
        data: {value: 13}
      - service: number.set_value
        target: {entity_id: number.nabaztag_nabi_ear_right}
        data: {value: 2}
      - delay: {milliseconds: 600}
      - service: number.set_value
        target: {entity_id: [number.nabaztag_nabi_ear_left, number.nabaztag_nabi_ear_right]}
        data: {value: 8}

automation:
  # Belly follows the colour of the day (skipped while the rabbit sleeps).
  - id: nabi_belly_tempo
    alias: "Nabaztag - belly follows the colour of the day"
    trigger:
      - platform: state
        entity_id: sensor.rte_tempo_couleur_actuelle   # <-- your colour source
      - platform: homeassistant
        event: start
    condition:
      - condition: template
        value_template: "{{ not is_state('switch.nabaztag_nabi_sleep', 'on') }}"
    action:
      - service: script.nabaztag_belly_tempo
    mode: single

  # Night: the rabbit dozes off, belly goes dark.
  - id: nabi_sleep_night
    alias: "Nabaztag - sleep at night (23:00)"
    trigger:
      - platform: time
        at: "23:00:00"
    action:
      - service: switch.turn_on
        target: {entity_id: switch.nabaztag_nabi_sleep}
      - service: light.turn_off
        target: {entity_id: light.nabaztag_nabi_belly}
    mode: single

  # Morning: wake up, belly back on, a little hello wiggle.
  - id: nabi_wake_morning
    alias: "Nabaztag - wake (07:00)"
    trigger:
      - platform: time
        at: "07:00:00"
    action:
      - service: switch.turn_off
        target: {entity_id: switch.nabaztag_nabi_sleep}
      - delay: {seconds: 2}
      - service: script.nabaztag_belly_tempo
      - service: script.nabaztag_ears_wiggle
    mode: single

  # Ears perk up when someone gets home.
  - id: nabi_arrival
    alias: "Nabaztag - ears on arrival"
    trigger:
      - platform: state
        entity_id: [person.member_one, person.member_two]   # <-- your people
        from: not_home
        to: home
    condition:
      - condition: template
        value_template: "{{ not is_state('switch.nabaztag_nabi_sleep', 'on') }}"
    action:
      - service: script.nabaztag_ears_wiggle
    mode: single

  # Ears wiggle when an appliance finishes. The from_state guard avoids a
  # false trigger when a cloud sensor bounces back from "unavailable".
  - id: nabi_appliance_done
    alias: "Nabaztag - ears when an appliance finishes"
    trigger:
      - platform: state
        entity_id:
          - sensor.dishwasher_current_status     # <-- your appliances
          - sensor.washer_current_status
          - sensor.dryer_current_status
        to: end
    condition:
      - condition: template
        value_template: "{{ trigger.from_state.state not in ['unavailable', 'unknown', ''] }}"
      - condition: template
        value_template: "{{ not is_state('switch.nabaztag_nabi_sleep', 'on') }}"
    action:
      - service: script.nabaztag_ears_wiggle
    mode: single

  # Nose double-blinks and ears shoot up when the intercom / doorbell rings.
  - id: nabi_intercom
    alias: "Nabaztag - nose blinks at the intercom"
    trigger:
      - platform: state
        entity_id: binary_sensor.intercom    # <-- your doorbell / intercom
        to: "on"
    action:
      - service: select.select_option
        target: {entity_id: select.nabaztag_nabi_nose}
        data: {option: double}
      - service: number.set_value
        target: {entity_id: [number.nabaztag_nabi_ear_left, number.nabaztag_nabi_ear_right]}
        data: {value: 2}
      - delay: {seconds: 5}
      - service: select.select_option
        target: {entity_id: select.nabaztag_nabi_nose}
        data: {option: "off"}
      - service: number.set_value
        target: {entity_id: [number.nabaztag_nabi_ear_left, number.nabaztag_nabi_ear_right]}
        data: {value: 8}
    mode: single
