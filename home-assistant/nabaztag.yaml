# Nabaztag — Home Assistant package
# ---------------------------------------------------------------------------
# Drop this file in /config/packages/nabaztag.yaml and enable packages once in
# configuration.yaml:
#
#   homeassistant:
#     packages: !include_dir_named packages
#
# Add to secrets.yaml:
#   nab_api: "<HAOS_IP>:8099"   # the nabaztag-violet add-on control API (host port 8099)
#   nab_mac: "<rabbit-mac>"     # rabbit MAC, lowercase, no colons (e.g. 0123456789ab)
#
# Speech uses the add-on's built-in local TTS (/api/say, espeak-ng) — no cloud,
# nothing to install, reachable on the same port the rabbit already uses.
# ---------------------------------------------------------------------------

rest_command:
  # Make the rabbit SPEAK arbitrary text (local espeak-ng TTS).
  nabaztag_say:
    url: "http://{{ api }}/api/say?mac={{ mac }}&text={{ text | urlencode }}{% if voice is defined %}&voice={{ voice }}{% endif %}{% if speed is defined %}&speed={{ speed }}{% endif %}"
    method: GET
    timeout: 20

  # Stream + play an audio URL the rabbit can reach (MP3 or 22kHz/16-bit mono WAV).
  nabaztag_play:
    url: "http://{{ api }}/api/play?mac={{ mac }}&url={{ media | urlencode }}"
    method: GET
    timeout: 20

  # Move the ears to positions (~0..16), independent left / right.
  nabaztag_ears:
    url: "http://{{ api }}/api/ears?mac={{ mac }}&left={{ left }}&right={{ right }}"
    method: GET
    timeout: 10

  # Full RGB on one LED: led = bottom|left|middle|right|top.
  nabaztag_led:
    url: "http://{{ api }}/api/led?mac={{ mac }}&led={{ led }}&r={{ r }}&g={{ g }}&b={{ b }}"
    method: GET
    timeout: 10

  # Belly weather icon: v = sun|cloudy|smog|rain|snow|storm.
  nabaztag_weather_icon:
    url: "http://{{ api }}/api/weather?mac={{ mac }}&v={{ v }}"
    method: GET
    timeout: 10

  # Nose: v = 0 none / 1 blink / 2 double-blink.
  nabaztag_nose:
    url: "http://{{ api }}/api/nose?mac={{ mac }}&v={{ v }}"
    method: GET
    timeout: 10

  # Wake (on=0) / sleep (on=1).
  nabaztag_sleep:
    url: "http://{{ api }}/api/sleep?mac={{ mac }}&on={{ on }}"
    method: GET
    timeout: 10

  # Passive listening ("hey Nabi"): on=1 starts it, on=0 stops it. PRIVACY: this
  # is opt-in and OFF by default. When off, the rabbit's mic does NOT stream at
  # all — turning it off sends RT so the rabbit stops capturing (not a server-side
  # mute). Push-to-talk (the head button) is independent and always available.
  nabaztag_listen:
    url: "http://{{ api }}/api/mic?mac={{ mac }}&on={{ on }}"
    method: GET
    timeout: 10

  # Play an original Nabaztag jingle (extracted from the firmware). name =
  # acquired | ack | abort | ministop | ears | rfid_ok | start_record |
  # end_record | start_interactive | end_interactive | previous | next.
  # (GET http://<api>/api/jingle lists them.)
  nabaztag_jingle:
    url: "http://{{ api }}/api/jingle?mac={{ mac }}&name={{ name }}"
    method: GET
    timeout: 15

  # Volume 0-100 (100 = loudest). Persists across reboots (re-applied on connect).
  nabaztag_volume:
    url: "http://{{ api }}/api/volume?mac={{ mac }}&level={{ level }}"
    method: GET
    timeout: 10

script:
  # --- Talk to Claude through the rabbit -----------------------------------
  # Pipes a prompt to the Home Assistant Anthropic (Claude) conversation agent
  # and speaks the reply on the rabbit. Mic input is Phase 2; this is the
  # output side (push a prompt from an automation, a button, or the chat).
  # Set agent_id to YOUR Anthropic integration's conversation entity
  # (Settings → Devices & services → Anthropic, or check Developer Tools → States
  # for the conversation.* entity it creates).
  nabaztag_ask_claude:
    alias: "Nabaztag - ask Claude, speak the reply"
    fields:
      prompt:
        description: "What to ask/tell Claude"
        example: "Donne-moi une phrase courte et drôle pour bien commencer la journée."
    sequence:
      - service: conversation.process
        data:
          agent_id: conversation.claude   # <-- adjust to your Anthropic agent entity
          text: "{{ prompt }}"
        response_variable: claude
      - service: rest_command.nabaztag_say
        data:
          api: !secret nab_api
          mac: !secret nab_mac
          text: "{{ claude.response.speech.plain.speech }}"

  # --- Weather "à la Violet": belly icon + the terse "Aujourd'hui… ✕ !" ------
  nabaztag_weather_announce:
    alias: "Nabaztag - weather (Aujourd'hui… ✕ !)"
    variables:
      cond: "{{ states('weather.home') }}"
      # weather.home state -> (belly icon, one-word French condition)
      m: >-
        {{ {
          'sunny':           ['sun','du soleil'],
          'clear-night':     ['sun','une nuit claire'],
          'partlycloudy':    ['cloudy','quelques nuages'],
          'cloudy':          ['cloudy','des nuages'],
          'fog':             ['smog','de la brume'],
          'rainy':           ['rain','pluie'],
          'pouring':         ['rain','pluie battante'],
          'snowy':           ['snow','neige'],
          'snowy-rainy':     ['snow','neige fondue'],
          'lightning':       ['storm','de l_orage'],
          'lightning-rainy': ['storm','de l_orage'],
          'windy':           ['cloudy','du vent'],
        }.get(cond, ['cloudy','des nuages']) }}
    sequence:
      - service: rest_command.nabaztag_weather_icon
        data: { api: !secret nab_api, mac: !secret nab_mac, v: "{{ m[0] }}" }
      - service: rest_command.nabaztag_say
        data:
          api: !secret nab_api
          mac: !secret nab_mac
          text: "Aujourd'hui [pause] {{ m[1] | replace('_',\"'\") }} !"

# --- Example automations ----------------------------------------------------
automation:
  - alias: "Nabaztag - welcome on arrival"
    trigger:
      - platform: state
        entity_id: person.kevin
        to: "home"
    action:
      - service: rest_command.nabaztag_jingle
        data: { api: !secret nab_api, mac: !secret nab_mac, name: acquired }
      - service: rest_command.nabaztag_ears
        data: { api: !secret nab_api, mac: !secret nab_mac, left: 3, right: 3 }
      - service: rest_command.nabaztag_led
        data: { api: !secret nab_api, mac: !secret nab_mac, led: "bottom", r: 0, g: 200, b: 60 }
      - service: rest_command.nabaztag_say
        data: { api: !secret nab_api, mac: !secret nab_mac, text: "Tiens, te voilà !" }

  - alias: "Nabaztag - intercom (Farfisa) flash"
    trigger:
      - platform: state
        entity_id: binary_sensor.farfisa_intercom
        to: "on"
    action:
      - repeat:
          count: 4
          sequence:
            - service: rest_command.nabaztag_led
              data: { api: !secret nab_api, mac: !secret nab_mac, led: "middle", r: 255, g: 0, b: 0 }
            - delay: "00:00:00.5"
            - service: rest_command.nabaztag_led
              data: { api: !secret nab_api, mac: !secret nab_mac, led: "middle", r: 0, g: 0, b: 0 }
            - delay: "00:00:00.5"
      - service: rest_command.nabaztag_say
        data: { api: !secret nab_api, mac: !secret nab_mac, text: "On sonne à la porte !" }

  - alias: "Nabaztag - morning weather"
    trigger:
      - platform: time
        at: "07:30:00"
    action:
      - service: script.nabaztag_weather_announce

  - alias: "Nabaztag - evening brief (Claude)"
    trigger:
      - platform: time
        at: "21:00:00"
    action:
      - service: script.nabaztag_ask_claude
        data:
          prompt: >-
            En une phrase courte et malicieuse, façon Nabaztag, souhaite une
            bonne soirée à la maison.

  - alias: "Nabaztag - Shiva walk reminder"
    trigger:
      - platform: time
        at: "18:30:00"
    action:
      - service: rest_command.nabaztag_ears
        data: { api: !secret nab_api, mac: !secret nab_mac, left: 10, right: 10 }
      - service: rest_command.nabaztag_say
        data: { api: !secret nab_api, mac: !secret nab_mac, text: "C'est l'heure de sortir Shiva !" }

  # Tie Nabi's own inputs (nabaztag_event) to its jingles. Example: double-click
  # the head → the "acquired" chime. Swap in any tag/button/jingle you like.
  - alias: "Nabaztag - double-click → jingle"
    trigger:
      - platform: event
        event_type: nabaztag_event
        event_data: { type: button, action: double_click }
    action:
      - service: rest_command.nabaztag_jingle
        data: { api: !secret nab_api, mac: !secret nab_mac, name: acquired }
