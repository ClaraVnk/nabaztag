# Nabaztag — Home Assistant package
# ---------------------------------------------------------------------------
# Drop this file in /config/packages/nabaztag.yaml and enable packages once in
# configuration.yaml:
#
#   homeassistant:
#     packages: !include_dir_named packages
#
# Add to secrets.yaml:
#   nab_api: "<HAOS_IP>:8099"   # the nabaztag-violet add-on control API (host port 8099)
#   nab_mac: "<rabbit-mac>"     # rabbit MAC, lowercase, no colons (e.g. 0123456789ab)
#
# These hit the add-on's control API on a trusted LAN (no token).
# ---------------------------------------------------------------------------

rest_command:
  # Stream + play any audio the rabbit can reach over HTTP (MP3/WAV). Use this
  # for TTS: render with HA's local TTS (Piper) to a file under /config/www and
  # pass its /local URL, or point it at a pre-rendered clip (see scripts below).
  nabaztag_play:
    url: "http://{{ api }}/api/play?mac={{ mac }}&url={{ media | urlencode }}"
    method: GET
    timeout: 15

  # Move the ears to positions (~0..16), independent left / right.
  nabaztag_ears:
    url: "http://{{ api }}/api/ears?mac={{ mac }}&left={{ left }}&right={{ right }}"
    method: GET
    timeout: 10

  # Full RGB on one LED: led = bottom|left|middle|right|top.
  nabaztag_led:
    url: "http://{{ api }}/api/led?mac={{ mac }}&led={{ led }}&r={{ r }}&g={{ g }}&b={{ b }}"
    method: GET
    timeout: 10

  # Belly weather icon: v = sun|cloudy|smog|rain|snow|storm.
  nabaztag_weather_icon:
    url: "http://{{ api }}/api/weather?mac={{ mac }}&v={{ v }}"
    method: GET
    timeout: 10

  # Nose: v = 0 none / 1 blink / 2 double-blink.
  nabaztag_nose:
    url: "http://{{ api }}/api/nose?mac={{ mac }}&v={{ v }}"
    method: GET
    timeout: 10

  # Wake (on=0) / sleep (on=1).
  nabaztag_sleep:
    url: "http://{{ api }}/api/sleep?mac={{ mac }}&on={{ on }}"
    method: GET
    timeout: 10

  # Raw program (advanced): text uses '|' as the newline between KEY value lines.
  nabaztag_program:
    url: "http://{{ api }}/api/program?mac={{ mac }}&text={{ text | urlencode }}"
    method: GET
    timeout: 10

# --- Local-TTS / iconic-clips note ------------------------------------------
# The Violet rabbit's charm is its TERSE, theatrical delivery — "Aujourd'hui…
# pluie !" — not a verbose sensor dump. That maps perfectly to a handful of
# pre-rendered clips. Render them once with HA's Piper (or any TTS) into
# /config/www/nabaztag/ so they're served at http://<HAOS_IP>:8123/local/nabaztag/<name>.mp3
# Suggested set (French): bonjour.mp3, soleil.mp3, pluie.mp3, nuages.mp3,
# neige.mp3, orage.mp3, brume.mp3, shiva.mp3, soir.mp3.
# For fully dynamic speech, render on the fly and pass the resulting media URL
# to rest_command.nabaztag_play.

script:
  # Speak the weather "à la Violet": belly icon + a one-word clip, with the
  # dramatic "Aujourd'hui…" pause baked into the clip itself.
  nabaztag_weather_announce:
    alias: "Nabaztag - weather (Aujourd'hui… ✕ !)"
    variables:
      cond: "{{ states('weather.home') }}"
      # weather.home state -> (belly icon, clip name)
      map: >-
        {{ {
          'sunny':        ['sun','soleil'],
          'clear-night':  ['sun','soleil'],
          'partlycloudy': ['cloudy','nuages'],
          'cloudy':       ['cloudy','nuages'],
          'fog':          ['smog','brume'],
          'rainy':        ['rain','pluie'],
          'pouring':      ['rain','pluie'],
          'snowy':        ['snow','neige'],
          'snowy-rainy':  ['snow','neige'],
          'lightning':    ['storm','orage'],
          'lightning-rainy':['storm','orage'],
        }.get(cond, ['cloudy','nuages']) }}
    sequence:
      - service: rest_command.nabaztag_weather_icon
        data: { api: !secret nab_api, mac: !secret nab_mac, v: "{{ map[0] }}" }
      - service: rest_command.nabaztag_play
        data:
          api: !secret nab_api
          mac: !secret nab_mac
          media: "http://<HAOS_IP>:8123/local/nabaztag/{{ map[1] }}.mp3"

# --- Example automations ----------------------------------------------------
automation:
  - alias: "Nabaztag - welcome on arrival"
    trigger:
      - platform: state
        entity_id: person.kevin
        to: "home"
    action:
      # ears perk up + a warm green + a hello
      - service: rest_command.nabaztag_ears
        data: { api: !secret nab_api, mac: !secret nab_mac, left: 3, right: 3 }
      - service: rest_command.nabaztag_led
        data: { api: !secret nab_api, mac: !secret nab_mac, led: "bottom", r: 0, g: 200, b: 60 }
      - service: rest_command.nabaztag_play
        data:
          api: !secret nab_api
          mac: !secret nab_mac
          media: "http://<HAOS_IP>:8123/local/nabaztag/bonjour.mp3"

  - alias: "Nabaztag - intercom (Farfisa) flash"
    trigger:
      - platform: state
        entity_id: binary_sensor.farfisa_intercom
        to: "on"
    action:
      - repeat:
          count: 4
          sequence:
            - service: rest_command.nabaztag_led
              data: { api: !secret nab_api, mac: !secret nab_mac, led: "middle", r: 255, g: 0, b: 0 }
            - delay: "00:00:00.5"
            - service: rest_command.nabaztag_led
              data: { api: !secret nab_api, mac: !secret nab_mac, led: "middle", r: 0, g: 0, b: 0 }
            - delay: "00:00:00.5"

  - alias: "Nabaztag - morning weather"
    trigger:
      - platform: time
        at: "07:30:00"
    action:
      - service: script.nabaztag_weather_announce

  - alias: "Nabaztag - evening brief"
    trigger:
      - platform: time
        at: "21:00:00"
    action:
      - service: rest_command.nabaztag_play
        data:
          api: !secret nab_api
          mac: !secret nab_mac
          media: "http://<HAOS_IP>:8123/local/nabaztag/soir.mp3"

  - alias: "Nabaztag - Shiva walk reminder"
    trigger:
      - platform: time
        at: "18:30:00"
    action:
      - service: rest_command.nabaztag_ears
        data: { api: !secret nab_api, mac: !secret nab_mac, left: 10, right: 10 }
      - service: rest_command.nabaztag_play
        data:
          api: !secret nab_api
          mac: !secret nab_mac
          media: "http://<HAOS_IP>:8123/local/nabaztag/shiva.mp3"
